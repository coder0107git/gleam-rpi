name: release
on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

permissions:
  contents: read

jobs:
  build-release:
    name: build-release
    runs-on: ${{ matrix.os }}
    permissions:
      id-token: write
      attestations: write
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - armv7-unknown-linux-gnueabihf
        toolchain: [ stable ]
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            expected-binary-architecture: x86-64
            cargo-tool: cross
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            expected-binary-architecture: aarch64
            cargo-tool: cross
          - os: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
            expected-binary-architecture: armhf
            cargo-tool: cross
          - os: ubuntu-latest
            target: wasm32-unknown-unknown
            cargo-tool: wasm-pack
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: "Build Archive"
        id: build
        uses: "./.github/actions/build-release"
        with:
          version: ${{ github.ref_name }}
          toolchain: ${{ matrix.toolchain }}
          target: ${{ matrix.target }}
          cargo-tool: ${{ matrix.cargo-tool }}
          expected-binary-architecture: ${{ matrix.expected-binary-architecture }}

  create-release:
    name: create-release

    needs: ['build-release']

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true

      - name: Create release
        env:
          GITHUB_TOKEN: '${{ github.token }}'
          REPOSITORY: '${{ github.repository }}'
          TITLE: '${{ github.ref_name }}'
          TAG_NAME: '${{ github.ref_name }}'
          NOTES: '${{ github.server_url }}/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md'
        run: |
          gh release create \
            --repo "$REPOSITORY" \
            --title "$TITLE" \
            --notes "$NOTES" \
            --draft \
            --verify-tag \
            ${{ contains(github.ref_name, '-rc') && '--prerelease' || '' }} \
            "$TAG_NAME" \
            gleam-*
